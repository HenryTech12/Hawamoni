spring.application.name=Hawamoni
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE_NAME:hawamoni}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:Henry123@#$}


#JPA AND HIBERNATE CONFIGURATION
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.show_sql=true

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
spring.cache.type=redis
spring.cache.data.redis.host=${REDIS_HOST:localhost}
spring.cache.data.redis.username=${REDIS_USERNAME}
spring.cache.data.redis.password=${REDIS_PASSWORD}
spring.cache.data.redis.port=${REDIS_PORT}

OAUTH_CLIENT_ID=${GOOGLE-CLIENT-ID}
OAUTH_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
OAUTH_ENDPOINT=${GOOGLE_OAUTH_ENDPOINT}


